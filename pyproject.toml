[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndt"
version = "0.2.0"
description = "Monotone spline networks for neural distribution transformation: quantile couplings with uniform error bounds"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mohamad Yamen AL Mohamad" },
    { name = "Ali Akbar Heydari" },
    { name = "Hossein Jabbari Khamnei" },
]
keywords = ["quantile coupling", "optimal transport", "monotone neural network", "quantile mapping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
parallel = ["joblib>=1.3"]
plot = ["matplotlib>=3.6"]
full = ["torch>=2.0", "joblib>=1.3", "matplotlib>=3.6", "pandas>=2.0", "tqdm>=4.65", "nbformat>=5.0"]
dev = ["pytest>=7", "nbformat>=5.0", "torch>=2.0", "joblib>=1.3", "matplotlib>=3.6", "pandas>=2.0"]

[project.scripts]
ndt = "ndt.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
